<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isa ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fff9db;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }

    /* ÁREA DE LA FLOR */
    .flower-wrapper {
      position: relative;
      width: 220px;
      height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .stem {
      position: absolute;
      bottom: 10px;
      width: 10px;
      height: 150px;
      background-color: #2e7d32;
      border-radius: 5px;
      z-index: 1;
    }

    .leaf-left {
      position: absolute;
      bottom: 50px;
      left: 65px;
      width: 40px;
      height: 20px;
      background-color: #2e7d32;
      border-radius: 20px 0px 20px 0px;
      transform: rotate(-25deg);
      z-index: 1;
    }

    .leaf-right {
      position: absolute;
      bottom: 40px;
      right: 65px;
      width: 40px;
      height: 20px;
      background-color: #2e7d32;
      border-radius: 0px 20px 0px 20px;
      transform: rotate(25deg);
      z-index: 1;
    }

    .flower-head {
      position: absolute;
      top: 10px;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .center-circle {
      position: absolute;
      width: 65px;
      height: 65px;
      background: radial-gradient(circle, #e65100 0%, #8d6e63 100%);
      border-radius: 50%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      cursor: pointer;
    }

    .center-circle::after {
      content: '💛';
      font-size: 24px;
    }

    /* PÉTALOS ORGANIZADOS */
    .petal {
      position: absolute;
      width: 42px;
      height: 80px;
      background: linear-gradient(to top, #fbc02d, #ffeb3b);
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      border: 1px solid #f57f17;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      transform-origin: center bottom;
      z-index: 5;
    }

    .petal:hover, .petal:active {
      filter: brightness(1.1);
    }

    .p1 { transform: translateY(-40px) rotate(0deg); }
    .p2 { transform: translateY(-40px) rotate(45deg); }
    .p3 { transform: translateY(-40px) rotate(90deg); }
    .p4 { transform: translateY(-40px) rotate(135deg); }
    .p5 { transform: translateY(-40px) rotate(180deg); }
    .p6 { transform: translateY(-40px) rotate(225deg); }
    .p7 { transform: translateY(-40px) rotate(270deg); }
    .p8 { transform: translateY(-40px) rotate(315deg); }

    /* TEXTOS Y MENSAJES */
    .title {
      font-size: 16px;
      color: #5d4037;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #8d6e63;
      text-align: center;
      margin-bottom: 20px;
    }

    .message-box {
      background-color: #ffffff;
      border: 1px solid #ffe082;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      text-align: center;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      color: #4e342e;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    /* BOTÓN DE MÚSICA */
    .music-btn {
      background-color: #d84315;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .music-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="flower-wrapper">
      <div class="stem"></div>
      <div class="leaf-left"></div>
      <div class="leaf-right"></div>
      
      <div class="flower-head">
        <div class="petal p1" onclick="showMessage(0)"></div>
        <div class="petal p2" onclick="showMessage(1)"></div>
        <div class="petal p3" onclick="showMessage(2)"></div>
        <div class="petal p4" onclick="showMessage(3)"></div>
        <div class="petal p5" onclick="showMessage(4)"></div>
        <div class="petal p6" onclick="showMessage(5)"></div>
        <div class="petal p7" onclick="showMessage(6)"></div>
        <div class="petal p8" onclick="showMessage(7)"></div>
        <div class="center-circle" onclick="showMessage('center')"></div>
      </div>
    </div>

    <div class="title">para isa :b</div>
    <div class="subtitle">de joandeku7>•<</div>

    <div class="message-box" id="msg-box">
      Toca cualquier pétalo de la flor... 💛
    </div>

    <button class="music-btn" onclick="toggleMusic()" id="music-btn">
      ▶ Reproducir: Alex G - Mary
    </button>

    <audio id="bg-music" loop preload="auto">
      <source src="https://files.catbox.moe/k6w7e2.mp3" type="audio/mpeg">
    </audio>

  </div>

  <script>
    const messages = [
      "Eres una persona super especial e increíble ✨",
      "Espero que esta flor amarilla te saque una sonrisa hoy 🌼",
      "Gracias por cada momento bonito 💛",
      "Tu presencia siempre alegra todo alrededor 🌻",
      "Te mereces las mejores cosas del mundo siempre ✨",
      "Nunca olvides lo mucho que vales 💛",
      "Espero que te guste mucho esta sorpresa :b",
      "Un detalle amarillo hecho solo para ti 🌼"
    ];

    function showMessage(index) {
      const box = document.getElementById('msg-box');
      if (index === 'center') {
        box.textContent = "¡Te quiero mucho, Isa! 💛✨";
      } else {
        box.textContent = messages[index];
      }
    }

    const audio = document.getElementById('bg-music');
    const btn = document.getElementById('music-btn');

    function toggleMusic() {
      if (audio.paused) {
        audio.play().then(() => {
          btn.textContent = "⏸ Pausar: Alex G - Mary";
        }).catch(err => {
          alert("Toca la pantalla e intenta presionar de nuevo.");
        });
      } else {
        audio.pause();
        btn.textContent = "▶ Reproducir: Alex G - Mary";
      }
    }
  </script>

</body>
</html>
