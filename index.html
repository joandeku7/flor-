<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor Amarilla para Isa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 10px;
      overflow-x: hidden;
      position: relative;
    }

    h1 {
      color: #78350f;
      font-size: 1.5rem;
      text-align: center;
      margin-top: 15px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      color: #92400e;
      font-size: 0.9rem;
      text-align: center;
      margin-top: 5px;
    }

    /* Contenedor principal de la flor */
    .flower-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 30px auto 10px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tallo */
    .stem {
      position: absolute;
      width: 12px;
      height: 160px;
      background: linear-gradient(to right, #15803d, #22c55e);
      bottom: -130px;
      border-radius: 6px;
      z-index: 1;
    }

    /* Hojas */
    .leaf {
      position: absolute;
      width: 50px;
      height: 25px;
      background-color: #15803d;
      border-radius: 0px 50px 0px 50px;
      z-index: 1;
    }
    .leaf.left {
      bottom: -70px;
      left: -40px;
      transform: rotate(-20deg);
    }
    .leaf.right {
      bottom: -90px;
      right: -40px;
      transform: scaleX(-1) rotate(-20deg);
    }

    /* Centro */
    .center-circle {
      position: absolute;
      width: 85px;
      height: 85px;
      background: radial-gradient(circle, #b45309 0%, #78350f 100%);
      border: 4px solid #f59e0b;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fef3c7;
      font-size: 1.8rem;
      user-select: none;
    }

    /* Pétalos */
    .petal {
      position: absolute;
      width: 65px;
      height: 125px;
      background: linear-gradient(to top, #facc15 0%, #fef08a 100%);
      border: 2px solid #eab308;
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      transform-origin: bottom center;
      bottom: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.3s ease, background 0.3s ease;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
    }

    .petal:active { transform: scale(1.08); }

    .petal:nth-child(1) { transform: rotate(0deg); }
    .petal:nth-child(2) { transform: rotate(45deg); }
    .petal:nth-child(3) { transform: rotate(90deg); }
    .petal:nth-child(4) { transform: rotate(135deg); }
    .petal:nth-child(5) { transform: rotate(180deg); }
    .petal:nth-child(6) { transform: rotate(225deg); }
    .petal:nth-child(7) { transform: rotate(270deg); }
    .petal:nth-child(8) { transform: rotate(315deg); }

    .petal.clicked {
      background: linear-gradient(to top, #fbbf24 0%, #fde68a 100%);
      border-color: #d97706;
      filter: brightness(0.95);
    }

    /* Dedicatoria */
    .dedication {
      margin-top: 130px;
      text-align: center;
      color: #78350f;
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1.4;
    }

    .dedication span {
      font-size: 0.95rem;
      color: #b45309;
    }

    /* Tarjeta de mensaje */
    .message-card {
      background-color: #ffffff;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 18px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(120, 53, 15, 0.15);
      margin-top: 15px;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .message-text {
      color: #78350f;
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.4;
    }

    /* Botón flotante para reproducir música */
    .play-bar {
      margin-top: 15px;
      margin-bottom: 10px;
      background-color: #b45309;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pop { animation: popAnim 0.3s ease-out; }
    @keyframes popAnim {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Archivo de Audio MP3 -->
  <audio id="audioMary" loop src="https://ia801503.us.archive.org/15/items/alex-g-trick/03.%20Mary.mp3"></audio>

  <div>
    <h1>🌻 Para Isa 🌻</h1>
    <p class="subtitle">Toca cada pétalo para descubrir un mensaje</p>
  </div>

  <div class="flower-container">
    <div class="stem">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>

    <!-- Pétalos -->
    <div class="petal" onclick="mostrarFrase(0, this)"></div>
    <div class="petal" onclick="mostrarFrase(1, this)"></div>
    <div class="petal" onclick="mostrarFrase(2, this)"></div>
    <div class="petal" onclick="mostrarFrase(3, this)"></div>
    <div class="petal" onclick="mostrarFrase(4, this)"></div>
    <div class="petal" onclick="mostrarFrase(5, this)"></div>
    <div class="petal" onclick="mostrarFrase(6, this)"></div>
    <div class="petal" onclick="mostrarFrase(7, this)"></div>

    <div class="center-circle">💛</div>
  </div>

  <!-- Dedicatoria -->
  <div class="dedication">
    para isa :b<br>
    <span>de joandeku7&gt;,&lt;</span>
  </div>

  <!-- Tarjeta de Mensajes -->
  <div class="message-card" id="card">
    <p class="message-text" id="phraseText">Toca cualquier pétalo de la flor...</p>
  </div>

  <!-- Botón manual para asegurarnos de que la música suene -->
  <button class="play-bar" id="playBtn" onclick="toggleAudio()">
    🎵 Reproducir: Alex G - Mary
  </button>

  <script>
    const audio = document.getElementById('audioMary');
    const playBtn = document.getElementById('playBtn');
    let isPlaying = false;

    function toggleAudio() {
      if (!isPlaying) {
        audio.play().then(() => {
          isPlaying = true;
          playBtn.innerHTML = "⏸️ Pausar música";
        }).catch(err => {
          console.log("Error de reproducción:", err);
        });
      } else {
        audio.pause();
        isPlaying = false;
        playBtn.innerHTML = "🎵 Reproducir: Alex G - Mary";
      }
    }

    const frases = [
      "✨ Eres el brillo que ilumina mis días más oscuros.",
      "💛 Cada momento a tu lado es mi lugar favorito en el mundo.",
      "🌸 Sonreír contigo es la razón más bonita de mi día.",
      "💖 Me haces feliz de una forma que nadie más puede lograr.",
      "🌟 Si volviera a nacer, te elegiría una y mil veces más.",
      "☀️ Tu amor le da color y calidez a toda mi vida.",
      "🎶 Tu voz y tu risa son mi melodía preferida.",
      "🌻 Como esta flor amarilla, traes luz y felicidad a mi corazón."
    ];

    function mostrarFrase(index, petaloEl) {
      // Activar música al tocar el primer pétalo si no ha sonado
      if (!isPlaying) {
        toggleAudio();
      }

      const card = document.getElementById('card');
      const phraseText = document.getElementById('phraseText');

      petaloEl.classList.add('clicked');

      card.classList.remove('pop');
      void card.offsetWidth;
      card.classList.add('pop');

      phraseText.textContent = frases[index];
    }
  </script>

</body>
</html>
