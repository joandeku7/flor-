<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isa ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fff9db;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
    }

    /* ÁREA DE LA FLOR */
    .flower-wrapper {
      position: relative;
      width: 250px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
    }

    /* TALLO Y HOJAS */
    .stem {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 160px;
      background-color: #2e7d32;
      border-radius: 5px;
      z-index: 1;
    }

    .leaf-left {
      position: absolute;
      bottom: 50px;
      left: 70px;
      width: 45px;
      height: 24px;
      background-color: #2e7d32;
      border-radius: 20px 0px 20px 0px;
      transform: rotate(-25deg);
      z-index: 1;
    }

    .leaf-right {
      position: absolute;
      bottom: 40px;
      right: 70px;
      width: 45px;
      height: 24px;
      background-color: #2e7d32;
      border-radius: 0px 20px 0px 20px;
      transform: rotate(25deg);
      z-index: 1;
    }

    /* CENTRO Y PÉTALOS DE LA FLOR */
    .flower-head {
      position: absolute;
      top: 15px;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .center-circle {
      position: absolute;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #5d4037 0%, #3e2723 100%);
      border-radius: 50%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
      color: #ffb300;
      font-size: 26px;
      user-select: none;
    }

    .petal {
      position: absolute;
      width: 42px;
      height: 90px;
      background: linear-gradient(to top, #fbc02d, #ffeb3b);
      border: 1.5px solid #f57f17;
      border-radius: 50% 50% 50% 50% / 80% 80% 20% 20%;
      cursor: pointer;
      transition: filter 0.2s, transform 0.2s;
      transform-origin: center bottom;
      top: 10px;
      z-index: 5;
    }

    .petal:hover, .petal:active {
      filter: brightness(1.1);
    }

    /* DISTRIBUCIÓN MATEMÁTICA PERFECTA (8 PÉTALOS) */
    .p1 { transform: rotate(0deg) translateY(-45px); }
    .p2 { transform: rotate(45deg) translateY(-45px); }
    .p3 { transform: rotate(90deg) translateY(-45px); }
    .p4 { transform: rotate(135deg) translateY(-45px); }
    .p5 { transform: rotate(180deg) translateY(-45px); }
    .p6 { transform: rotate(225deg) translateY(-45px); }
    .p7 { transform: rotate(270deg) translateY(-45px); }
    .p8 { transform: rotate(315deg) translateY(-45px); }

    /* TEXTOS */
    .title {
      font-size: 18px;
      color: #5d4037;
      font-weight: bold;
      text-align: center;
      margin-top: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #8d6e63;
      text-align: center;
      margin-bottom: 15px;
    }

    .message-box {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      text-align: center;
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      color: #4e342e;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* BOTÓN YOUTUBE */
    .youtube-link {
      background-color: #e65100;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.2s, transform 0.1s;
      display: inline-block;
      text-align: center;
    }

    .youtube-link:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="flower-wrapper">
      <div class="stem"></div>
      <div class="leaf-left"></div>
      <div class="leaf-right"></div>
      
      <div class="flower-head">
        <div class="petal p1" onclick="showMessage(0)"></div>
        <div class="petal p2" onclick="showMessage(1)"></div>
        <div class="petal p3" onclick="showMessage(2)"></div>
        <div class="petal p4" onclick="showMessage(3)"></div>
        <div class="petal p5" onclick="showMessage(4)"></div>
        <div class="petal p6" onclick="showMessage(5)"></div>
        <div class="petal p7" onclick="showMessage(6)"></div>
        <div class="petal p8" onclick="showMessage(7)"></div>
        <div class="center-circle" onclick="showMessage('center')">💛</div>
      </div>
    </div>

    <div class="title">para isa :b</div>
    <div class="subtitle">de joandeku7>•<</div>

    <div class="message-box" id="msg-box">
      Toca cualquier pétalo de la flor... 💛
    </div>

    <a class="youtube-link" href="https://www.youtube.com/watch?v=FR31HVr2_LU" target="_blank" rel="noopener noreferrer">
      ▶ Ver canción: Alex G - Mary
    </a>

  </div>

  <script>
    const messages = [
      "me haces muy feliz :3",
      "eres la mejor la mejor y lo mejor que puede existir",
      "bleh",
      "siempre estaré junto a ti >,<",
      "te quiero demasiado te amo te sodor :b",
      "estas bien linda guapa bella preciosa <3",
      "una flor para ti diosa mia porque te la mereces 💛",
      "gracias por existir y estar junto a mi >•<"
    ];

    function showMessage(index) {
      const box = document.getElementById('msg-box');
      if (index === 'center') {
        box.textContent = "te quiero muchísimo isa!! 💛✨";
      } else {
        box.textContent = messages[index];
      }
    }
  </script>

</body>
</html>
