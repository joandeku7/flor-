<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isa ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fff9db;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
    }

    /* ESTILOS DE LA FLOR EN SVG */
    .flower-svg {
      width: 260px;
      height: 320px;
    }

    .petal {
      fill: #ffeb3b;
      stroke: #f57f17;
      stroke-width: 2;
      cursor: pointer;
      transition: fill 0.2s;
    }

    .petal:hover, .petal:active {
      fill: #fff176;
    }

    .center-circle {
      fill: #8d6e63;
      stroke: #5d4037;
      stroke-width: 3;
      cursor: pointer;
    }

    .center-heart {
      fill: #ffb300;
      cursor: pointer;
    }

    /* TEXTOS */
    .title {
      font-size: 18px;
      color: #5d4037;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
    }

    .subtitle {
      font-size: 13px;
      color: #8d6e63;
      text-align: center;
      margin-bottom: 15px;
    }

    .message-box {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      text-align: center;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      color: #4e342e;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* BOTÓN DE YOUTUBE */
    .youtube-link {
      background-color: #e65100;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: background-color 0.2s, transform 0.1s;
      display: inline-block;
      text-align: center;
    }

    .youtube-link:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <svg class="flower-svg" viewBox="0 0 200 250">
      <!-- TALLO Y HOJAS -->
      <path d="M100 120 Q102 180 100 240" stroke="#2e7d32" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M100 190 Q70 180 60 200 Q80 210 100 190" fill="#2e7d32"/>
      <path d="M100 170 Q130 160 140 180 Q120 190 100 170" fill="#2e7d32"/>

      <!-- 8 PÉTALOS PERFECTAMENTE DISTRIBUIDOS -->
      <g>
        <!-- Pétalo Arriba -->
        <path class="petal" d="M100 120 C85 70 85 30 100 30 C115 30 115 70 100 120" onclick="showMessage(0)"/>
        <!-- Pétalo Arriba-Derecha -->
        <path class="petal" d="M100 120 C125 75 153 90 163 105 C150 125 120 125 100 120" onclick="showMessage(1)"/>
        <!-- Pétalo Derecha -->
        <path class="petal" d="M100 120 C150 105 190 105 190 120 C190 135 150 135 100 120" onclick="showMessage(2)"/>
        <!-- Pétalo Abajo-Derecha -->
        <path class="petal" d="M100 120 C135 140 155 170 140 180 C120 170 110 145 100 120" onclick="showMessage(3)"/>
        <!-- Pétalo Abajo -->
        <path class="petal" d="M100 120 C115 170 115 200 100 200 C85 200 85 170 100 120" onclick="showMessage(4)"/>
        <!-- Pétalo Abajo-Izquierda -->
        <path class="petal" d="M100 120 C65 140 45 170 60 180 C80 170 90 145 100 120" onclick="showMessage(5)"/>
        <!-- Pétalo Izquierda -->
        <path class="petal" d="M100 120 C50 105 10 105 10 120 C10 135 50 135 100 120" onclick="showMessage(6)"/>
        <!-- Pétalo Arriba-Izquierda -->
        <path class="petal" d="M100 120 C75 75 47 90 37 105 C50 125 80 125 100 120" onclick="showMessage(7)"/>
      </g>

      <!-- CENTRO DE LA FLOR CON CORAZÓN -->
      <circle class="center-circle" cx="100" cy="120" r="28" onclick="showMessage('center')"/>
      <path class="center-heart" d="M100 125 L93 118 A5 5 0 0 1 100 111 A5 5 0 0 1 107 118 Z" onclick="showMessage('center')"/>
    </svg>

    <div class="title">para isa :b</div>
    <div class="subtitle">de joandeku7>•<</div>

    <div class="message-box" id="msg-box">
      Toca cualquier pétalo de la flor... 💛
    </div>

    <!-- BOTÓN QUE DIRIGE A YOUTUBE -->
    <a class="youtube-link" href="https://www.youtube.com/watch?v=FR31HVr2_LU" target="_blank" rel="noopener noreferrer">
      ▶ Ver canción: Alex G - Mary
    </a>

  </div>

  <script>
    const messages = [
      "me haces muy feliz :3",
      "eres la mejor la mejor y lo mejor que puede existir",
      "bleh",
      "siempre estaré junto a ti >,<",
      "te quiero demasiado te amo te sodor :b",
      "estas bien linda guapa bella preciosa <3",
      "una flor para ti diosa mia porque te la mereces 💛",
      "gracias por existir y estar junto a mi >•<"
    ];

    function showMessage(index) {
      const box = document.getElementById('msg-box');
      if (index === 'center') {
        box.textContent = "te quiero muchísimo isa!! 💛✨";
      } else {
        box.textContent = messages[index];
      }
    }
  </script>

</body>
</html>
