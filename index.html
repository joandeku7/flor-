<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isa ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%);
      font-family: 'Quicksand', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
      z-index: 10;
    }

    /* CONTENEDOR Y ANIMACIÓN DE LA FLOR */
    .flower-wrapper {
      position: relative;
      width: 260px;
      height: 270px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: gentleSway 4s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }

    @keyframes gentleSway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* TALLO Y HOJAS */
    .stem {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 140px;
      background: linear-gradient(to right, #2e7d32, #4caf50);
      border-radius: 10px;
      z-index: 1;
    }

    .leaf {
      position: absolute;
      background: linear-gradient(to right, #388e3c, #66bb6a);
      border-radius: 0px 50px 0px 50px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      z-index: 1;
    }

    .leaf-left {
      bottom: 45px;
      left: 70px;
      width: 48px;
      height: 26px;
      transform: rotate(-30deg);
      animation: leafFloatLeft 3s ease-in-out infinite alternate;
    }

    .leaf-right {
      bottom: 30px;
      right: 70px;
      width: 48px;
      height: 26px;
      border-radius: 50px 0px 50px 0px;
      transform: rotate(30deg);
      animation: leafFloatRight 3s ease-in-out infinite alternate;
    }

    @keyframes leafFloatLeft {
      0% { transform: rotate(-30deg) scale(1); }
      100% { transform: rotate(-35deg) scale(1.05); }
    }

    @keyframes leafFloatRight {
      0% { transform: rotate(30deg) scale(1); }
      100% { transform: rotate(35deg) scale(1.05); }
    }

    /* CENTRO DE LA FLOR */
    .flower-head {
      position: absolute;
      top: 10px;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .center-circle {
      position: absolute;
      width: 75px;
      height: 75px;
      background: radial-gradient(circle, #5d4037 0%, #3e2723 100%);
      border: 3px solid #fbc02d;
      border-radius: 50%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 15px rgba(62, 39, 35, 0.3);
      cursor: pointer;
      color: #ffd54f;
      font-size: 28px;
      user-select: none;
      transition: transform 0.2s;
    }

    .center-circle:active {
      transform: scale(1.1);
    }

    /* PÉTALOS */
    .petal {
      position: absolute;
      width: 36px;
      height: 85px;
      background: linear-gradient(180deg, #ffee58 0%, #fbc02d 100%);
      border: 1px solid #f57f17;
      border-radius: 50% 50% 45% 45% / 70% 70% 30% 30%;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.08);
      transform-origin: center bottom;
      top: 15px;
      z-index: 5;
      transition: transform 0.2s, filter 0.2s;
    }

    .petal:active {
      filter: brightness(1.15);
      transform: scale(1.1) !important;
    }

    .p1  { transform: rotate(0deg) translateY(-42px); }
    .p2  { transform: rotate(30deg) translateY(-42px); }
    .p3  { transform: rotate(60deg) translateY(-42px); }
    .p4  { transform: rotate(90deg) translateY(-42px); }
    .p5  { transform: rotate(120deg) translateY(-42px); }
    .p6  { transform: rotate(150deg) translateY(-42px); }
    .p7  { transform: rotate(180deg) translateY(-42px); }
    .p8  { transform: rotate(210deg) translateY(-42px); }
    .p9  { transform: rotate(240deg) translateY(-42px); }
    .p10 { transform: rotate(270deg) translateY(-42px); }
    .p11 { transform: rotate(300deg) translateY(-42px); }
    .p12 { transform: rotate(330deg) translateY(-42px); }

    /* TEXTOS */
    .title {
      font-size: 20px;
      color: #4e342e;
      font-weight: 700;
      text-align: center;
      margin-top: 5px;
    }

    .subtitle {
      font-size: 13px;
      color: #8d6e63;
      text-align: center;
      margin-bottom: 10px;
    }

    /* CAJA DE MENSAJE */
    .message-box {
      background-color: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 16px;
      padding: 14px;
      width: 100%;
      text-align: center;
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 15px rgba(0,0,0,0.05);
      color: #3e2723;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }

    /* BOTÓN YOUTUBE */
    .youtube-link {
      background: linear-gradient(135deg, #f57c00 0%, #e65100 100%);
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(230, 81, 0, 0.3);
      display: inline-block;
      text-align: center;
      margin-bottom: 20px;
    }

    /* SECCIÓN MINIJUEGO */
    .game-section {
      background: #ffffff;
      border: 2px dashed #fbc02d;
      border-radius: 16px;
      padding: 15px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .game-title {
      font-size: 14px;
      font-weight: bold;
      color: #5d4037;
      margin-bottom: 8px;
    }

    .game-btn {
      background-color: #ffb300;
      color: #3e2723;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin-bottom: 8px;
    }

    .score-board {
      font-size: 13px;
      color: #8d6e63;
      font-weight: 600;
    }

    /* CORAZONES CAYENDO (ANIMACIÓN DEL JUEGO) */
    .falling-heart {
      position: fixed;
      top: -40px;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
      z-index: 999;
      animation: fall 3.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="flower-wrapper">
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      
      <div class="flower-head">
        <div class="petal p1" onclick="showMessage(0)"></div>
        <div class="petal p2" onclick="showMessage(1)"></div>
        <div class="petal p3" onclick="showMessage(2)"></div>
        <div class="petal p4" onclick="showMessage(3)"></div>
        <div class="petal p5" onclick="showMessage(4)"></div>
        <div class="petal p6" onclick="showMessage(5)"></div>
        <div class="petal p7" onclick="showMessage(6)"></div>
        <div class="petal p8" onclick="showMessage(7)"></div>
        <div class="petal p9" onclick="showMessage(0)"></div>
        <div class="petal p10" onclick="showMessage(1)"></div>
        <div class="petal p11" onclick="showMessage(3)"></div>
        <div class="petal p12" onclick="showMessage(4)"></div>
        
        <div class="center-circle" onclick="showMessage('center')">💛</div>
      </div>
    </div>

    <div class="title">para isa :b</div>
    <div class="subtitle">de joandeku7>•<</div>

    <div class="message-box" id="msg-box">
      Toca cualquier pétalo de la flor... 💛
    </div>

    <a class="youtube-link" href="https://www.youtube.com/watch?v=FR31HVr2_LU" target="_blank" rel="noopener noreferrer">
      ▶ Ver canción: Alex G - Mary
    </a>

    <!-- MINIJUEGO -->
    <div class="game-section">
      <div class="game-title">🎮 Minijuego: Atrapa los corazones para Isa</div>
      <button class="game-btn" onclick="toggleGame()" id="game-btn">▶ Iniciar minijuego</button>
      <div class="score-board" id="score-board">Corazones atrapados: 0 ❤️</div>
    </div>

  </div>

  <script>
    const messages = [
      "me haces muy feliz :3",
      "eres la mejor la mejor y lo mejor que puede existir",
      "bleh",
      "siempre estaré junto a ti >,<",
      "te quiero demasiado te amo te sodor :b",
      "estas bien linda guapa bella preciosa <3",
      "una flor para ti diosa mia porque te la mereces 💛",
      "gracias por existir y estar junto a mi >•<"
    ];

    function showMessage(index) {
      const box = document.getElementById('msg-box');
      if (index === 'center') {
        box.textContent = "te quiero muchísimo isa!! 💛✨";
      } else {
        box.textContent = messages[index];
      }
    }

    /* LÓGICA DEL MINIJUEGO */
    let gameInterval = null;
    let score = 0;
    let isPlaying = false;

    function toggleGame() {
      const btn = document.getElementById('game-btn');
      if (!isPlaying) {
        isPlaying = true;
        btn.textContent = "⏸ Pausar juego";
        gameInterval = setInterval(spawnHeart, 700);
      } else {
        isPlaying = false;
        btn.textContent = "▶ Reanudar juego";
        clearInterval(gameInterval);
      }
    }

    function spawnHeart() {
      const heart = document.createElement('div');
      heart.classList.add('falling-heart');
      
      const emojis = ['💖', '💛', '✨', '💕', '🌸'];
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      
      heart.style.left = Math.random() * (window.innerWidth - 40) + 'px';
      
      heart.onclick = function() {
        score++;
        document.getElementById('score-board').textContent = `Corazones atrapados: ${score} ❤️`;
        heart.remove();
      };

      document.body.appendChild(heart);

      setTimeout(() => {
        if (heart.parentNode) {
          heart.remove();
        }
      }, 3500);
    }
  </script>

</body>
</html>
